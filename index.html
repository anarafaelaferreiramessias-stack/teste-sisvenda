<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SisVenda | Premium Access</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <style>
        /* Variáveis de Cores */
        :root {
            --glass-bg: rgba(255, 255, 255, 0.15);
            --glass-border: rgba(255, 255, 255, 0.2);
            --text-color: #ffffff;
            --accent: #00f2fe;
        }

        /* Fundo Animado */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(-45deg, #0f172a, #1e293b, #4f46e5, #7c3aed);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            overflow: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Card Principal (Efeito Vidro) */
        .login-container {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            padding: 50px 40px;
            border-radius: 24px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
            position: relative;
        }

        .login-container::before {
            content: '';
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            background: linear-gradient(45deg, transparent, var(--glass-border), transparent);
            border-radius: 24px;
            z-index: -1;
        }

        /* Cabeçalho */
        .header { margin-bottom: 40px; }
        .icon-circle {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.4);
        }
        .icon-circle i { font-size: 2.5rem; color: #fff; }
        .header h1 { color: #fff; font-size: 1.8rem; letter-spacing: 1px; margin: 0; }
        .header p { color: rgba(255, 255, 255, 0.7); font-size: 0.9rem; margin-top: 5px; }

        /* Estilo dos Inputs */
        .input-group {
            margin-bottom: 25px;
            position: relative;
            text-align: left;
        }

        .input-group label {
            display: block;
            color: rgba(255, 255, 255, 0.9);
            font-size: 0.85rem;
            margin-bottom: 8px;
            margin-left: 5px;
            font-weight: 500;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            left: 15px;
            color: var(--accent);
            font-size: 1.2rem;
        }

        .input-wrapper input {
            width: 100%;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 14px 15px 14px 45px;
            border-radius: 12px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: 0.3s all ease;
        }

        .input-wrapper input:focus {
            background: rgba(255, 255, 255, 0.15);
            border-color: var(--accent);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.2);
        }

        .input-wrapper input::placeholder { color: rgba(255, 255, 255, 0.3); }

        /* Botão de Acesso */
        .btn-login {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: #0f172a;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.4s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
        }

        .btn-login:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 242, 254, 0.3);
            filter: brightness(1.1);
        }

        .btn-login:active { transform: translateY(0); }

        /* Mensagens e Links Extras */
        .error-msg {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-top: 20px;
            display: none;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .extra-links {
            margin-top: 25px;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.5);
        }

        .extra-links a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
        }

    </style>
</head>
<body>

    <div class="login-container">
        <div class="header">
            <div class="icon-circle">
                <i class="ri-rocket-2-fill"></i>
            </div>
            <h1>SisVenda Pro</h1>
            <p>Seu negócio em outro nível</p>
        </div>

        <form id="loginForm">
            <div class="input-group">
                <label>NOME DE USUÁRIO</label>
                <div class="input-wrapper">
                    <i class="ri-user-smile-line"></i>
                    <input type="text" id="user" placeholder="Ex: amanda_vendas" required>
                </div>
            </div>

            <div class="input-group">
                <label>SENHA DE ACESSO</label>
                <div class="input-wrapper">
                    <i class="ri-shield-keyhole-line"></i>
                    <input type="password" id="pass" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="btn-login">
                ENTRAR NO SISTEMA
                <i class="ri-arrow-right-line"></i>
            </button>

            <div id="error-message" class="error-msg">
                <i class="ri-error-warning-line"></i> Usuário ou senha incorretos!
            </div>
        </form>

        <div class="extra-links">
            Esqueceu a senha? <a href="#">Clique aqui</a>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const user = document.getElementById('user').value;
            const pass = document.getElementById('pass').value;
            const error = document.getElementById('error-message');

            // Simulação de login
            if (user === "admin" && pass === "1234") {
                const btn = document.querySelector('.btn-login');
                btn.innerHTML = '<i class="ri-loader-4-line ri-spin"></i> CARREGANDO...';
                btn.style.opacity = "0.7";
                
                setTimeout(() => {
                    alert("Acesso autorizado! Bem-vindo ao SisVenda.");
                    // window.location.href = "seu-dashboard.html";
                }, 1500);
            } else {
                error.style.display = "block";
                error.style.animation = "shake 0.4s ease";
                
                // Limpar erro após 3 segundos
                setTimeout(() => { error.style.display = "none"; }, 3000);
            }
        });
    </script>

    <style>
        /* Animação de erro (shake) */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }
    </style>
</body>
</html>
